<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314">
  <!-- The Windows installer's welcome/finish sidebar (164×314): a wizard flings a fork away and raises a spoon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa2ff"/>
      <stop offset="0.5" stop-color="#5b67ea"/>
      <stop offset="1" stop-color="#2e2585"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe680" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6ff"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f9e"/>
      <stop offset="1" stop-color="#231b6b"/>
    </linearGradient>
    <linearGradient id="dull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9bccb"/>
      <stop offset="1" stop-color="#7d8199"/>
    </linearGradient>
  </defs>

  <rect width="164" height="314" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="20" cy="24" r="1.1" opacity="0.8"/>
    <circle cx="140" cy="18" r="1.4" opacity="0.9"/>
    <circle cx="118" cy="52" r="0.9" opacity="0.7"/>
    <circle cx="12" cy="120" r="1" opacity="0.6"/>
    <circle cx="150" cy="150" r="1.1" opacity="0.7"/>
    <circle cx="70" cy="40" r="0.8" opacity="0.6"/>
    <circle cx="150" cy="232" r="0.9" opacity="0.5"/>
    <circle cx="16" cy="210" r="0.9" opacity="0.5"/>
  </g>

  <!-- the fork, flung away: a dashed arc from the wizard's hand, the fork tumbling off, a little puff -->
  <path d="M38 196 C 20 160, 18 110, 34 78" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="3 4" stroke-linecap="round"/>
  <g transform="translate(40 58) rotate(-35)">
    <rect x="-2" y="2" width="4" height="30" rx="2" fill="url(#dull)"/>
    <path d="M-8 -14 L-8 -2 Q-8 4 0 4 Q8 4 8 -2 L8 -14" fill="none" stroke="url(#dull)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-2.7" y1="-14" x2="-2.7" y2="0" stroke="url(#dull)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="2.7" y1="-14" x2="2.7" y2="0" stroke="url(#dull)" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.85">
    <line x1="22" y1="40" x2="16" y2="34"/>
    <line x1="26" y1="34" x2="25" y2="26"/>
    <line x1="18" y1="48" x2="10" y2="47"/>
  </g>

  <!-- the spoon's glow -->
  <circle cx="128" cy="92" r="34" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="84" cy="287" rx="44" ry="6" fill="#140f45" opacity="0.45"/>

  <!-- robe -->
  <path d="M84 168 C 70 172, 62 200, 56 232 L 46 284 L 122 284 L 112 232 C 106 200, 98 172, 84 168 Z" fill="url(#robe)"/>
  <path d="M46 284 L 122 284 L 120 276 L 48 276 Z" fill="#8fa2ff" opacity="0.55"/>
  <g fill="#ffe680" opacity="0.85">
    <path d="M70 246 l1.6 3.4 3.6 .4 -2.7 2.4 .8 3.6 -3.3 -1.9 -3.3 1.9 .8 -3.6 -2.7 -2.4 3.6 -.4 z"/>
    <path d="M98 222 l1.2 2.6 2.8 .3 -2.1 1.9 .6 2.8 -2.5 -1.5 -2.5 1.5 .6 -2.8 -2.1 -1.9 2.8 -.3 z"/>
    <circle cx="90" cy="262" r="1.3"/>
    <circle cx="66" cy="214" r="1.1"/>
  </g>

  <!-- left arm, still out from the throw -->
  <path d="M74 182 C 62 186, 50 192, 40 196" fill="none" stroke="#2f2588" stroke-width="10" stroke-linecap="round"/>
  <circle cx="38" cy="196" r="5" fill="#f2c9a5"/>

  <!-- right arm, raising the spoon -->
  <path d="M95 182 C 106 170, 114 150, 118 134" fill="none" stroke="#2f2588" stroke-width="10" stroke-linecap="round"/>

  <!-- the spoon -->
  <g transform="rotate(18 124 104)">
    <rect x="121.6" y="102" width="4.8" height="34" rx="2.4" fill="url(#metal)"/>
    <ellipse cx="124" cy="92" rx="8.5" ry="12" fill="url(#metal)"/>
    <ellipse cx="122" cy="88" rx="3" ry="5" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="118" cy="132" r="5.2" fill="#f2c9a5"/>
  <g fill="#fff7c2">
    <path d="M144 70 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4 -3 -3 -1.4 3 -1.4 z"/>
    <path d="M106 66 l1 2.2 2.2 1 -2.2 1 -1 2.2 -1 -2.2 -2.2 -1 2.2 -1 z"/>
    <path d="M148 108 l.9 1.9 1.9 .9 -1.9 .9 -.9 1.9 -.9 -1.9 -1.9 -.9 1.9 -.9 z"/>
  </g>

  <!-- head and beard -->
  <circle cx="84" cy="158" r="12" fill="#f2c9a5"/>
  <path d="M73 160 C 73 178, 78 196, 84 204 C 90 196, 95 178, 95 160 C 90 166, 78 166, 73 160 Z" fill="#f4f4fb"/>
  <path d="M78 164 Q 84 168 90 164" fill="none" stroke="#c9c9dd" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="79.5" cy="155" r="1.4" fill="#2a2244"/>
  <circle cx="88.5" cy="155" r="1.4" fill="#2a2244"/>
  <path d="M77 150.5 q2.5 -2 5 0 M86 150.5 q2.5 -2 5 0" fill="none" stroke="#f4f4fb" stroke-width="1.6" stroke-linecap="round"/>

  <!-- hat -->
  <path d="M66 148 C 72 120, 82 100, 100 84 C 96 104, 98 128, 102 148 Z" fill="#3b2f9e"/>
  <path d="M100 84 C 106 82, 110 86, 108 92" fill="none" stroke="#3b2f9e" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="84" cy="148" rx="24" ry="5" fill="#2a2180"/>
  <path d="M67 142 C 78 145, 92 145, 101 142 L 101.5 147 C 92 150, 78 150, 66.5 147 Z" fill="#ffe680" opacity="0.9"/>
  <path d="M86 116 l1.4 3 3.2 .4 -2.4 2.2 .7 3.2 -2.9 -1.7 -2.9 1.7 .7 -3.2 -2.4 -2.2 3.2 -.4 z" fill="#ffe680"/>
  <circle cx="80" cy="132" r="1.4" fill="#fff7c2"/>

  <!-- name -->
  <text x="82" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">Spoon</text>
</svg>
